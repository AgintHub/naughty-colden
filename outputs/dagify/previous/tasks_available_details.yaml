dag_type: plain_text
description: Identify tasks that can be completed
name: tasks_available
nodes:
  define_task_categories:
    agent: false
    description: Identify categories of tasks
    name: define_task_categories
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the main categories of tasks that can be completed (e.g., creative
      writing, data analysis, web development). Limit to 5 categories.
  extract_task_descriptions:
    agent: false
    description: Gather detailed descriptions of tasks in each category
    name: extract_task_descriptions
    nodes_depended_on:
    - define_task_categories
    nodes_dependent_on: []
    prompt: Provide a list of tasks for each category, along with their brief descriptions.
      Limit each task description to 2-3 sentences.
  filter_tasks_by_complexity:
    agent: false
    description: Identify tasks by level of complexity
    name: filter_tasks_by_complexity
    nodes_depended_on:
    - extract_task_descriptions
    nodes_dependent_on: []
    prompt: For each task, categorize it by complexity level (e.g., easy, medium,
      hard). Provide a brief explanation for each level.
  generate_task_recommendations:
    agent: false
    description: Offer personalized task recommendations
    name: generate_task_recommendations
    nodes_depended_on:
    - filter_tasks_by_complexity
    nodes_dependent_on: []
    prompt: Based on the filtered tasks, provide 3-5 personalized task recommendations
      that align with the user's interests and skill levels. Provide a brief description
      for each recommendation.
  map_tasks_to_skills:
    agent: false
    description: Identify the skills required for each task
    name: map_tasks_to_skills
    nodes_depended_on:
    - extract_task_descriptions
    nodes_dependent_on: []
    prompt: For each task, list the required skills (e.g., proficiency in a programming
      language, experience with design software). Limit to 3-5 skills per task.
  query_task_availability:
    agent: false
    description: Check the availability of tasks based on user input
    name: query_task_availability
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Given the user's interests and skill levels, identify which tasks are
      currently available for completion. Limit to 5 tasks.
